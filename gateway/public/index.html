<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RouteDesk</title>
<style>
  :root { --border: #d9dde3; --muted: #6b7280; --accent: #2563eb; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f7f8fa; color: #1f2430;
  }
  header {
    padding: 20px 24px; background: #fff; border-bottom: 1px solid var(--border);
  }
  header h1 { margin: 0; font-size: 20px; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  main { max-width: 900px; margin: 24px auto; padding: 0 16px; display: grid; gap: 24px; }
  .card { background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 20px; }
  .card h2 { margin: 0 0 14px; font-size: 15px; }
  form { display: grid; gap: 12px; }
  label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 4px; }
  input, select, textarea {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px;
    font-size: 14px; font-family: inherit;
  }
  textarea { resize: vertical; min-height: 60px; }
  button {
    background: var(--accent); color: #fff; border: none; padding: 10px 16px;
    border-radius: 6px; font-size: 14px; cursor: pointer; justify-self: start;
  }
  button:hover { background: #1d4ed8; }
  button.secondary { background: #fff; color: var(--accent); border: 1px solid var(--accent); }
  button.secondary:hover { background: #eff4ff; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; }
  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px;
    font-weight: 600; color: #fff;
  }
  .status-msg { font-size: 13px; margin-top: 8px; }
  .status-msg.error { color: #b91c1c; }
  .status-msg.ok { color: #15803d; }
  .empty { color: var(--muted); font-size: 13px; padding: 8px 0; }
  .top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: #f3f6fb; }
  .overlay {
    position: fixed; inset: 0; background: rgba(15, 20, 30, 0.45);
    display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  .overlay.hidden { display: none; }
  .modal {
    background: #fff; border-radius: 10px; padding: 22px; max-width: 480px; width: 100%;
    max-height: 90vh; overflow-y: auto;
  }
  .modal h3 { margin: 0 0 4px; font-size: 17px; }
  .modal .meta-line { color: var(--muted); font-size: 12px; margin-bottom: 14px; }
  .modal .desc { font-size: 14px; margin-bottom: 16px; white-space: pre-wrap; }
  .modal-row { display: grid; gap: 12px; margin-bottom: 14px; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; }
  button.danger { background: #fff; color: #b91c1c; border: 1px solid #b91c1c; margin-right: auto; }
  button.danger:hover { background: #fef2f2; }
  .archived-row { opacity: 0.55; }
  .toggle-row { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>RouteDesk</h1>
  <p>Submit a request, it gets auto-routed to the right team and stored via the ticket-service.</p>
</header>

<main>
  <section class="card">
    <h2>New ticket</h2>
    <form id="ticket-form">
      <div>
        <label for="title">Title</label>
        <input id="title" name="title" required maxlength="120" placeholder="VPN not connecting" />
      </div>
      <div>
        <label for="description">Description</label>
        <textarea id="description" name="description" placeholder="Optional details"></textarea>
      </div>
      <div>
        <label for="category">Category</label>
        <select id="category" name="category">
          <option value="billing">billing</option>
          <option value="outage">outage</option>
          <option value="incident">incident</option>
          <option value="bug">bug</option>
          <option value="access">access</option>
          <option value="permissions">permissions</option>
          <option value="other">other (general-support)</option>
        </select>
      </div>
      <button type="submit">Create ticket</button>
      <div id="form-status" class="status-msg"></div>
    </form>
  </section>

  <section class="card">
    <div class="top-row">
      <h2 style="margin:0">Tickets</h2>
      <div style="display:flex; align-items:center; gap:16px;">
        <label class="toggle-row">
          <input type="checkbox" id="show-archived-toggle" style="width:auto;" />
          Show archived
        </label>
        <button type="button" class="secondary" id="refresh-btn">Refresh</button>
      </div>
    </div>
    <div id="tickets-container"><p class="empty">Loading…</p></div>
  </section>
</main>

<div class="overlay hidden" id="modal-overlay">
  <div class="modal">
    <h3 id="modal-title"></h3>
    <div class="meta-line" id="modal-meta"></div>
    <div class="desc" id="modal-desc"></div>
    <div class="modal-row">
      <div>
        <label for="modal-status">Status</label>
        <select id="modal-status"></select>
      </div>
      <div>
        <label for="modal-assignee">Assignee</label>
        <select id="modal-assignee"></select>
      </div>
    </div>
    <div id="modal-status-msg" class="status-msg"></div>
    <div class="modal-actions">
      <button type="button" class="danger" id="modal-archive">Archive</button>
      <button type="button" class="secondary" id="modal-close">Close</button>
      <button type="button" id="modal-save">Save</button>
    </div>
  </div>
</div>

<script>
const TEAM_COLORS = {
  'finance-ops': '#7c3aed',
  'sre-oncall': '#dc2626',
  'engineering': '#2563eb',
  'it-support': '#ea580c',
  'general-support': '#6b7280',
};

let ticketsCache = [];
let roster = { statuses: [], teamMembers: {} };

async function loadRoster() {
  try {
    const res = await fetch('/api/tickets/meta/roster');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    roster = await res.json();
  } catch (err) {
    console.warn('Failed to load roster:', err.message);
  }
}

async function loadTickets() {
  const container = document.getElementById('tickets-container');
  const includeArchived = document.getElementById('show-archived-toggle').checked;
  try {
    const res = await fetch(`/api/tickets${includeArchived ? '?includeArchived=true' : ''}`);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    ticketsCache = await res.json();
    renderTickets(ticketsCache);
  } catch (err) {
    container.innerHTML = '<p class="status-msg error">Failed to load tickets: ' + err.message + '</p>';
  }
}

function renderTickets(tickets) {
  const container = document.getElementById('tickets-container');
  if (!tickets.length) {
    container.innerHTML = '<p class="empty">No tickets yet — create one above.</p>';
    return;
  }
  const rows = tickets.slice().reverse().map(t => {
    const color = TEAM_COLORS[t.team] || '#6b7280';
    const created = new Date(t.createdAt).toLocaleString();
    return `<tr data-id="${t.id}" class="${t.archived ? 'archived-row' : ''}">
      <td>#${t.id}</td>
      <td>${escapeHtml(t.title)}</td>
      <td>${escapeHtml(t.category)}</td>
      <td><span class="badge" style="background:${color}">${escapeHtml(t.team)}</span></td>
      <td>${escapeHtml(t.status)}${t.archived ? ' (archived)' : ''}</td>
      <td>${escapeHtml(t.assignee || '—')}</td>
      <td>${created}</td>
    </tr>`;
  }).join('');
  container.innerHTML = `<table>
    <thead><tr><th>ID</th><th>Title</th><th>Category</th><th>Team</th><th>Status</th><th>Assignee</th><th>Created</th></tr></thead>
    <tbody>${rows}</tbody>
  </table>`;

  container.querySelectorAll('tbody tr').forEach(row => {
    row.addEventListener('click', () => openModal(Number(row.dataset.id)));
  });
}

function openModal(id) {
  const ticket = ticketsCache.find(t => t.id === id);
  if (!ticket) return;

  document.getElementById('modal-title').textContent = `#${ticket.id} — ${ticket.title}`;
  document.getElementById('modal-meta').textContent =
    `Category: ${ticket.category || '—'} · Team: ${ticket.team} · Created: ${new Date(ticket.createdAt).toLocaleString()}`;
  document.getElementById('modal-desc').textContent = ticket.description || '(no description)';

  const statusSelect = document.getElementById('modal-status');
  const statuses = roster.statuses && roster.statuses.length ? roster.statuses : ['open', 'in-progress', 'resolved', 'closed'];
  statusSelect.innerHTML = statuses.map(s =>
    `<option value="${s}" ${s === ticket.status ? 'selected' : ''}>${s}</option>`
  ).join('');

  const assigneeSelect = document.getElementById('modal-assignee');
  const teamRoster = (roster.teamMembers && roster.teamMembers[ticket.team]) || [];
  const options = ['(unassigned)', ...teamRoster];
  if (ticket.assignee && !options.includes(ticket.assignee)) options.push(ticket.assignee);
  assigneeSelect.innerHTML = options.map(name => {
    const value = name === '(unassigned)' ? '' : name;
    const selected = (ticket.assignee || '') === value ? 'selected' : '';
    return `<option value="${escapeHtml(value)}" ${selected}>${escapeHtml(name)}</option>`;
  }).join('');

  document.getElementById('modal-status-msg').textContent = '';
  document.getElementById('modal-status-msg').className = 'status-msg';
  document.getElementById('modal-save').dataset.id = ticket.id;
  document.getElementById('modal-overlay').classList.remove('hidden');
}

function closeModal() {
  document.getElementById('modal-overlay').classList.add('hidden');
}

async function saveModal() {
  const id = Number(document.getElementById('modal-save').dataset.id);
  const status = document.getElementById('modal-status').value;
  const assignee = document.getElementById('modal-assignee').value;
  const msgEl = document.getElementById('modal-status-msg');

  try {
    const res = await fetch(`/api/tickets/${id}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status, assignee }),
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    msgEl.textContent = 'Saved.';
    msgEl.className = 'status-msg ok';
    await loadTickets();
    setTimeout(closeModal, 500);
  } catch (err) {
    msgEl.textContent = 'Failed to save: ' + err.message;
    msgEl.className = 'status-msg error';
  }
}

async function archiveModal() {
  const id = Number(document.getElementById('modal-save').dataset.id);
  const msgEl = document.getElementById('modal-status-msg');
  if (!confirm(`Archive ticket #${id}? It will be hidden from the default list.`)) return;

  try {
    const res = await fetch(`/api/tickets/${id}`, { method: 'DELETE' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    msgEl.textContent = 'Archived.';
    msgEl.className = 'status-msg ok';
    await loadTickets();
    setTimeout(closeModal, 500);
  } catch (err) {
    msgEl.textContent = 'Failed to archive: ' + err.message;
    msgEl.className = 'status-msg error';
  }
}

document.getElementById('modal-close').addEventListener('click', closeModal);
document.getElementById('modal-save').addEventListener('click', saveModal);
document.getElementById('modal-archive').addEventListener('click', archiveModal);
document.getElementById('modal-overlay').addEventListener('click', (e) => {
  if (e.target.id === 'modal-overlay') closeModal();
});
document.getElementById('show-archived-toggle').addEventListener('change', loadTickets);

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

document.getElementById('ticket-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const statusEl = document.getElementById('form-status');
  statusEl.textContent = '';
  statusEl.className = 'status-msg';

  const title = document.getElementById('title').value.trim();
  const description = document.getElementById('description').value.trim();
  const category = document.getElementById('category').value;

  if (!title) {
    statusEl.textContent = 'Title is required.';
    statusEl.className = 'status-msg error';
    return;
  }

  try {
    const res = await fetch('/api/tickets', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title, description, category }),
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const ticket = await res.json();
    statusEl.textContent = `Created ticket #${ticket.id}, routed to ${ticket.team}.`;
    statusEl.className = 'status-msg ok';
    e.target.reset();
    document.getElementById('category').value = 'billing';
    loadTickets();
  } catch (err) {
    statusEl.textContent = 'Failed to create ticket: ' + err.message;
    statusEl.className = 'status-msg error';
  }
});

document.getElementById('refresh-btn').addEventListener('click', loadTickets);

loadRoster().then(loadTickets);
</script>
</body>
</html>
